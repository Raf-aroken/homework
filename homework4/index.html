<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Формы</title>
    <link rel="stylesheet" href="./style.css">
</head>
<form class="form">
    <fieldset class="form-group">
        <h3 class="text-h3">Ваши личные данные</h3>
        <label> Ваше имя
            <input type="text" placeholder="Имя" required name="name" class="input">
        </label>
        <label> Ваш возраст
            <input type="number" inputmode="numeric" placeholder="Возраст" required name="age" class="input">
        </label>
        <label> Ваш номер телефона
            <input type="tel" inputmode="tel" placeholder="Номер телефона" required name="tel" class="input">
        </label>
        <label> Ваша почта
            <input type="email" inputmode="email" placeholder="Почта" required name="email" class="input">
        </label>
        <fieldset class="form-group-2">
            <label>Сообщение
                <textarea name="сообщение" class="textarea"></textarea>
            </label>
            <label>
                <input type="checkbox" class="input-2" name="принятие правил">
                Я принимаю правила
            </label>
        </fieldset>
</form>
<button class="button">Отправить</button>

<body>

</body>

</html>
